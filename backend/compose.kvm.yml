x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: joyno-hr

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_MIGRATIONS_ON_STARTUP: "false"
      # Payroll is live: HR runs, approves and closes payroll and emails payslips from the production site.
      PAYROLL_ENABLED: "true"
      PAYROLL_FINALIZATION_ENABLED: "true"
      PAYSLIPS_URL: "https://joyno-hr.pages.dev/payroll"
      RUN_BACKGROUND_JOBS: ${RUN_BACKGROUND_JOBS:-false}
    ports:
      - "127.0.0.1:3001:3000"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
