<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR System</title>
    <script>
      try {
        document.documentElement.dataset.bootTheme = localStorage.getItem('theme_mode') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.bootTheme = 'light'
      }
    </script>
    <style>
      #boot-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8e5df;
        color: #191714;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #boot-loader-content {
        max-width: 520px;
        padding: 24px;
        text-align: center;
      }

      #boot-spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 14px;
        border: 3px solid #c4bcb0;
        border-top-color: #a77d24;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      #boot-title {
        margin: 0 0 8px;
        color: #76551b;
        font-size: 20px;
      }

      #boot-message {
        margin: 0;
        color: #645e54;
        font-size: 14px;
      }

      html[data-boot-theme='dark'] #boot-loader {
        background: #050505;
        color: #f5f5f5;
      }

      html[data-boot-theme='dark'] #boot-spinner {
        border-color: #3a3a3a;
        border-top-color: #d8aa24;
      }

      html[data-boot-theme='dark'] #boot-title {
        color: #eabf35;
      }

      html[data-boot-theme='dark'] #boot-message {
        color: #a3a3a3;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-loader">
        <div id="boot-loader-content">
          <div id="boot-spinner"></div>
          <h1 id="boot-title">Joyno HR</h1>
          <p id="boot-message">
            Connecting to server...
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
